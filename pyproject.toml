[project]
name = "ini-file-escape-handler"
version = "0.1.0"
description = "Handles escape sequences in INI file values, interpreting backslash-escaped characters and preserving literal backslashes as needed."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
